schema_version: finance.ontology-mapping-pilot.v1
suite: ontology_mapping_pilot_v1
issue: AIsummit26-uqa
intent: Evaluate the incremental benefit and cost of explicit business-to-physical mappings over a complete physical schema on supported financial requests.
catalog: configs/agentic_request_schema_contracts_v2.yaml
physical: ontology/finbench.ontology.yaml
mapping: ontology/business_request_finbench.mapping.yaml
projection: ontology/fibo_finbench.projection.yaml
arms: [physical_schema, business_mapping]
repeats: 2
model:
  provider: mara
  name: gemma-4-31B-it
  temperature: 0.0
  reasoning_effort: null
  max_tokens: 1500
  request_timeout_s: 90
graph:
  uri: bolt://127.0.0.1:7687
  database: finbenchsf1v2
  container: graphrag-neo4j
  sf: 1
  workspace_id: default
  anchor: 108
  row_cap: 50
  query_timeout_s: 2
  max_leaf_estimated_rows: 5000
  max_graph_hops: 4
budget:
  max_model_calls: 24
  max_prompt_bytes_per_call: 10000
  max_total_prompt_bytes: 240000
  max_completion_tokens: 36000
  max_wall_seconds: 1800
  delay_seconds: 2
  transport_retries: 0
  semantic_repairs: 0
decision:
  phase: exploratory_pilot
  thresholds: {paired_outcomes: 12, min_wins: 2, max_losses: 0, max_token_ratio: 1.5}
  primary: Paired exact-column, typed-value, order-aware Gold result agreement; guardrail rejections remain failures.
  success: Advance only if business_mapping gains at least 2 of 12 paired outcomes, regresses 0, and total prompt+completion tokens are at most 1.5 times the control on complete pairs.
  reject: Reject this configuration if business_mapping has fewer correct paired outcomes or exceeds 1.5 times the control token cost without a correctness gain.
  otherwise: Inconclusive; no claim of statistical significance or a general ontology effect.
  limits: This is a new model/protocol arm, not a rerun of the earlier full/retrieved FIBO comparison. All six requests are supported; refusal-policy and legal-control cases require their own experiment. Both arms receive the same physical names, property types, edge directions, user parameters, expected columns and harness rules. Only business_mapping receives the same fixed business vocabulary mapping; no Gold query or values are included. The mapping is local/partial FIBO projection, not formal ontology reasoning or FIBO conformance.
cases:
  - id: inbound_amount_band
    params: {min_amount: 10000}
  - id: high_risk_rail_and_medium
    params: {risk_weight: 3}
  - id: shared_medium_access
    params: {result_limit: 10}
    row_cap: 10
  - id: loan_applicant_facilities
    params: {}
    seed: >-
      MATCH (p:Person|Company {_workspace_id:$workspace_id})-[:OWN]->(a:Account {_workspace_id:$workspace_id})
      MATCH (p)-[:APPLY]->(:Loan {_workspace_id:$workspace_id})
      RETURN a.acct_no AS acct_no ORDER BY acct_no LIMIT 1
  - id: repayment_ratio_policy
    params: {repaid_ratio: 0.75}
    seed: >-
      MATCH (a:Account {_workspace_id:$workspace_id})-[r:REPAY]->(l:Loan {_workspace_id:$workspace_id})
      WITH a, l, sum(r.amount) AS repaid WHERE repaid < l.principal * $repaid_ratio
      RETURN a.acct_no AS acct_no ORDER BY acct_no LIMIT 1
  - id: corporate_investor_account_exposure
    params: {}
    parameter_overrides:
      company_id: {type: string, source: user, pattern: '^Company:[0-9]+$'}
    seed: >-
      MATCH (:Person|Company {_workspace_id:$workspace_id})-[:INVEST]->(c:Company {_workspace_id:$workspace_id})-[:OWN]->(:Account {_workspace_id:$workspace_id})
      RETURN c.id AS company_id ORDER BY company_id LIMIT 1
