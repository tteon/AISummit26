# Answers one question continuously: does seocho@main still run this experiment?
#
# The published results stay pinned to the tag in requirements.txt; this job installs
# requirements-upstream.txt (seocho at main) and runs the smoke test that exercises exactly
# the surface agent_interaction.py imports. Three triggers:
#
#   - a daily schedule, so a breaking seocho change surfaces within a day even if nobody
#     remembered to tell this repo;
#   - repository_dispatch, so seocho's own CI can notify this repo the moment main moves —
#     add to seocho's workflow:
#
#       - uses: peter-evans/repository-dispatch@v3
#         with:
#           token: ${{ secrets.AISUMMIT26_DISPATCH_TOKEN }}   # PAT with repo scope here
#           repository: tteon/AIsummit26
#           event-type: seocho-updated
#
#   - pushes that touch the integration surface itself.
name: seocho upstream

on:
  schedule:
    - cron: "17 21 * * *"   # 06:17 KST daily
  repository_dispatch:
    types: [seocho-updated]
  workflow_dispatch:
  push:
    paths:
      - requirements-base.txt
      - requirements-upstream.txt
      - scripts/smoke_seocho.py
      - ontology/finbench.ontology.yaml
      - .github/workflows/seocho-upstream.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install seocho@main and the harness dependencies
        run: pip install -r requirements-upstream.txt
      - name: Smoke-test the surface agent_interaction.py uses
        run: python scripts/smoke_seocho.py

  # The tag pin must keep working too — a smoke failure here means the published results are
  # no longer reproducible, which is worse news than upstream drift.
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned seocho the results were produced against
        run: pip install -r requirements.txt
      - name: Smoke-test the pinned surface
        run: python scripts/smoke_seocho.py
