# ==============================================================================
# Complete Inventory of Benchmark Questions (13 FinBench + 2 FIBO Standards)
# ==============================================================================

# --- [EASY TIER] ---
- id: "ext_easy_1"
  difficulty: "easy"
  audience: "external"
  title: "Incoming Transfers Aggregate"
  question: "내 계좌로 지금까지 들어온 이체는 몇 건이고 총액은 얼마인가요? (For account number 1001: how many incoming transfers has it received in total, and what is their total value?)"
  anchor: 1001

- id: "ext_easy_2"
  difficulty: "easy"
  audience: "external"
  title: "Outgoing Transfers Aggregate"
  question: "내 계좌에서 나간 이체 건수와 그 중 가장 큰 금액은? (For account number 1001: how many outgoing transfers are there, and what is the single largest amount sent?)"
  anchor: 1001

- id: "int_easy_1"
  difficulty: "easy"
  audience: "internal"
  title: "Account Count & Risk Tier 5 Proportion"
  question: "전체 계좌 수와 최고위험(등급 5) 계좌 수는? (How many accounts are there in total, and how many of them are at risk_tier 5?)"
  anchor: 1001

- id: "int_easy_2"
  difficulty: "easy"
  audience: "internal"
  title: "Top 5 Volume Channels"
  question: "가장 많은 거래가 일어난 상위 5개 채널 코드는 무엇인가요? (Which five channels carry the most transactions? Give the channel codes in descending order of total transaction count.)"
  anchor: 1001

# --- [MEDIUM TIER] ---
- id: "ext_med_1"
  difficulty: "medium"
  audience: "external"
  title: "High-Risk Channel Transfers (Finding 1: Attribute Ambiguity)"
  question: "위험도 5 이상의 채널을 통해 계좌 1001번으로 송금한 계좌 상위 5개는? (Which accounts sent money to account number 1001 on a transfer whose own channel_risk property is 5 or more? Give the five lowest such account numbers in ascending order.)"
  anchor: 1001

- id: "ext_med_2"
  difficulty: "medium"
  audience: "external"
  title: "Destination Account Ownership (Polymorphic Person | Company)"
  question: "계좌 1001번이 송금한 목적지 계좌들의 실제 소유자 상위 5명은? (Who owns the accounts that account number 1001 has sent money to? Give the five lowest owner ids in ascending order.)"
  anchor: 1001

- id: "int_med_1"
  difficulty: "medium"
  audience: "internal"
  title: "Self-Transfer Cycle by Same Owner (Triangular Motif)"
  question: "동일한 소유자가 가진 서로 다른 두 계좌 간에 직접 송금이 발생한 고유 계좌 쌍의 수는? (How many distinct ordered pairs of two different accounts owned by the same party have a direct transfer running from the first to the second?)"
  anchor: 1001

- id: "int_med_2"
  difficulty: "medium"
  audience: "internal"
  title: "Fan-in Structuring Accounts (>100 senders)"
  question: "100개 이상의 서로 다른 계좌로부터 송금을 받은 계좌 상위 5개는? (Which accounts received transfers from more than 100 distinct sending accounts? Give the five lowest such account numbers in ascending order.)"
  anchor: 1001

# --- [HARD TIER] ---
- id: "ext_hard_1"
  difficulty: "hard"
  audience: "external"
  title: "2-Hop Downstream Hub Traversal (Finding 1: Power-Law Expansion)"
  question: "계좌 1001번에서 시작하여 다운스트림 2단계 이내로 도달 가능한 고유 계좌 수와 그 중 최고 위험 등급은? (Starting from account number 1001 and following transfers downstream, how many distinct accounts are reachable within two hops, and what is the highest risk_tier among them?)"
  anchor: 1001

- id: "ext_hard_2"
  difficulty: "hard"
  audience: "external"
  title: "2-Hop Upstream Inflow Senders"
  question: "계좌 1001번으로 2단계 이내에 자금을 보낸 업스트림 계좌의 총 수는? (How many distinct accounts sit within two transfer hops upstream of account number 1001?)"
  anchor: 1001

- id: "int_hard_1"
  difficulty: "hard"
  audience: "internal"
  title: "Three-Layer Conjunction with Mutual Guarantee Trap (Finding 2)"
  question: "서로 송금이 오가고, 소유자들끼리 상호 보증(guarantee one another)을 섰으며, 동일한 단말기(Medium)로 로그인된 계좌 쌍을 찾아라. (Find pairs of accounts where money moved between them, owners guarantee one another, and common login device signed in.)"
  anchor: 1001

- id: "int_hard_1b"
  difficulty: "hard"
  audience: "internal"
  title: "Three-Layer Conjunction (Unambiguous Direction)"
  question: "서로 어느 방향이든 송금이 오가고, 소유자 중 한 명이 다른 한 명을 보증하며, 동일 로그인 단말기를 공유하는 계좌 쌍을 찾아라. (Find pairs of accounts where money moved in either direction, one owner guarantees the other in either direction, and same login device signed into both.)"
  anchor: 1001

- id: "int_hard_2"
  difficulty: "hard"
  audience: "internal"
  title: "Smurfing Ring / Aggregation Below Threshold"
  question: "1,000만원 미만의 소액으로 쪼개어 하나의 동일 계좌로 가장 많은 송금을 보낸 실소유자는 누구인가? (Which party owns the largest number of distinct accounts that all send money into one single common account, where every transfer is below threshold?)"
  anchor: 1001

# --- [FIBO STANDARDS EXTENSIONS] ---
- id: "FIBO_R1_UBO_Shell_Ring"
  difficulty: "hard"
  standard: "FIBO FBC (fibo-be-le-lp & fibo-be-le-cb)"
  title: "Multi-tier Ultimate Beneficial Owner (UBO) Corporate Chain"
  question: "동일한 자연인(NaturalPerson)이 지주회사/자회사를 거쳐 다단계(UBO)로 지배하는 계좌들 사이에서 직접 송금이 발생하고, 동일 단말기로 로그인된 자금세탁망을 찾아라. (Identify accounts controlled by the same NaturalPerson through multi-tier corporate ownership where funds moved directly between those accounts and both signed in from a common device.)"
  anchor: 1001

- id: "FIBO_R2_Loan_Guaranteed_Integration"
  difficulty: "hard"
  standard: "FIBO FBC (fibo-fbc-dae-dbt:ThirdPartyGuarantee)"
  title: "Collateralized Loan Proceeds Layering & Guarantee Circle"
  question: "대출금(LoanFacility)이 실행(DISBURSED_TO)되어 송금된 계좌의 소유자가, 해당 대출 상환인의 소유자로부터 연대보증(GUARANTEES_PARTY)을 받고 있는 자금세탁 통합 루프를 탐지하라. (Detect value paths where loan proceeds were transferred onward, and destination account owner is guaranteed by the loan repayer owner.)"
  anchor: 1001
