# Declarative user-request workload for the Agent API <-> Bolt repair-loop sweep.
#
# Each item is a real AML/financial-operations request class, not a synthetic Cypher puzzle.
# The physical FinBench graph remains the execution truth. FIBO terms label intent only where
# projection status permits it; schema facets and parameter contracts identify why a repair
# might be required. Scope, anchor and LIMIT remain harness-owned.
suite: agentic_request_repair_sweep_v1
workspace_id: default

questions:
  - id: customer_inflow_summary
    request_type: customer_service
    real_world_case: "Customer asks for an inbound-payment summary for their own account."
    audience: external
    difficulty: easy
    schema_facets: [Account, TRANSFER, direction, amount, subject_scope]
    repair_risks: [relationship_direction, aggregate_alias]
    question: "For account number {a}: how many incoming transfers are there and what is their total amount?"
    shape: scalar
    keys: [n, total]
    ref: >-
      MATCH (:Account {acct_no:$a,_workspace_id:$ws})<-[t:TRANSFER]-(:Account {_workspace_id:$ws})
      RETURN count(t) AS n, sum(t.amount) AS total
    params: {}

  - id: customer_counterparty_owner
    request_type: customer_service
    real_world_case: "Customer requests the beneficial owners of accounts they paid."
    audience: external
    difficulty: medium
    schema_facets: [Account, TRANSFER, OWN, ownership_direction, subject_scope]
    repair_risks: [multi_hop_join, ownership_endpoint]
    question: "Who owns the accounts that account number {a} has sent money to? Give the five lowest owner ids in ascending order."
    shape: list
    column: owner
    ref: >-
      MATCH (:Account {acct_no:$a,_workspace_id:$ws})-[:TRANSFER]->(b:Account {_workspace_id:$ws})<-[:OWN]-(o)
      RETURN DISTINCT o.id AS owner ORDER BY owner LIMIT 5
    params: {}

  - id: aml_high_risk_rail_inflow
    request_type: aml_alert_triage
    real_world_case: "Analyst triages high-risk payment-rail inflows to an alerted account."
    audience: internal
    difficulty: medium
    schema_facets: [Account, TRANSFER, channel_risk, threshold_parameter, subject_scope]
    repair_risks: [parameter_binding, relationship_direction, aggregate_alias]
    question: "Which transfers into account {a} rode a channel with risk {risk_weight} or higher? Count them and sum their amounts."
    shape: scalar
    keys: [risky_transfers, risky_amount]
    ref: >-
      MATCH (src:Account {_workspace_id:$workspace_id})-[t:TRANSFER]->(dst:Account {_workspace_id:$workspace_id,acct_no:$acct_no})
      WHERE t.channel_risk >= $risk_weight
      RETURN count(t) AS risky_transfers, sum(t.amount) AS risky_amount LIMIT $limit
    params: {risk_weight: 2}

  - id: aml_structuring_fanin
    request_type: aml_alert_triage
    real_world_case: "Investigator checks repeated senders feeding an account, a structuring signal."
    audience: internal
    difficulty: hard
    schema_facets: [Account, TRANSFER, grouping, threshold_parameter, subject_scope]
    repair_risks: [with_pipeline, parameter_binding, ordering]
    question: "Which sender accounts made at least {min_count} separate transfers into account {a}?"
    shape: list
    column: sender
    ref: >-
      MATCH (src:Account {_workspace_id:$workspace_id})-[t:TRANSFER]->(dst:Account {_workspace_id:$workspace_id,acct_no:$acct_no})
      WITH src, count(t) AS k WHERE k >= $min_count
      RETURN src.acct_no AS sender, k ORDER BY k DESC LIMIT $limit
    params: {min_count: 1}

  - id: ubo_candidate_exposure
    request_type: kyc_ubo_review
    real_world_case: "KYC reviewer asks for persons behind company-held accounts through holdings."
    audience: internal
    difficulty: medium
    schema_facets: [Person, Company, Account, INVEST, OWN, FIBO_proxy]
    repair_risks: [semantic_to_physical_mapping, multi_hop_join, distinct_aggregate]
    question: "How many persons stand behind company-owned accounts through an investment into the owning company?"
    shape: scalar
    keys: [ubo_candidates]
    ref: >-
      MATCH (p:Person {_workspace_id:$workspace_id})-[:INVEST]->(c:Company {_workspace_id:$workspace_id})-[:OWN]->(a:Account {_workspace_id:$workspace_id})
      RETURN count(DISTINCT p) AS ubo_candidates LIMIT $limit
    params: {}

  - id: guarantee_chain_exposure
    request_type: credit_risk_review
    real_world_case: "Credit-risk analyst measures chained guaranty exposure across parties."
    audience: internal
    difficulty: hard
    schema_facets: [Person, Company, GUARANTEE, direction, grouping, FIBO_proxy]
    repair_risks: [relationship_direction, with_pipeline, aggregate_alias]
    question: "How many chains of two consecutive guarantees exist, and how many distinct parties start one?"
    shape: scalar
    keys: [chain_starters, chains]
    ref: >-
      MATCH (x:Person|Company {_workspace_id:$workspace_id})-[g1:GUARANTEE]->(y:Person|Company {_workspace_id:$workspace_id})-[g2:GUARANTEE]->(z:Person|Company {_workspace_id:$workspace_id})
      WITH x, count(*) AS chains
      RETURN count(x) AS chain_starters, sum(chains) AS chains LIMIT $limit
    params: {}

  - id: payment_rail_mix
    request_type: payments_operations
    real_world_case: "Payments operator reviews an account's transaction mix by payment rail."
    audience: internal
    difficulty: medium
    schema_facets: [Account, USES_CHANNEL, Channel, aggregate, local_extension]
    repair_risks: [relationship_name, aggregate_alias, ordering]
    question: "Over which channels does account {a} transact, and how many transactions per channel?"
    shape: list
    column: channel
    ref: >-
      MATCH (a:Account {_workspace_id:$workspace_id,acct_no:$acct_no})-[u:USES_CHANNEL]->(c:Channel {_workspace_id:$workspace_id})
      RETURN c.code AS channel, sum(u.tx_count) AS transactions ORDER BY transactions DESC LIMIT $limit
    params: {}

  - id: loan_proceeds_path
    request_type: credit_risk_review
    real_world_case: "Credit investigator checks whether loan proceeds reached an account through layering."
    audience: internal
    difficulty: medium
    schema_facets: [Loan, DEPOSIT, Account, TRANSFER, variable_length_path, FIBO_proxy]
    repair_risks: [relationship_direction, variable_length_path, distinct_aggregate]
    question: "Did loan proceeds reach account {a} within three transfer hops of a disbursement? Count the loans."
    shape: scalar
    keys: [loans]
    ref: >-
      MATCH (l:Loan {_workspace_id:$workspace_id})-[:DEPOSIT]->(x:Account {_workspace_id:$workspace_id})-[:TRANSFER*1..3]->(dst:Account {_workspace_id:$workspace_id,acct_no:$acct_no})
      RETURN count(DISTINCT l) AS loans LIMIT $limit
    params: {}

  - id: loan_repayment_gap
    request_type: credit_risk_review
    real_world_case: "Collections analyst finds facilities repaid below a policy ratio."
    audience: internal
    difficulty: hard
    schema_facets: [Account, REPAY, Loan, amount, grouping, threshold_parameter, FIBO_proxy]
    repair_risks: [with_pipeline, parameter_binding, property_arithmetic]
    question: "For each loan, compare its principal against the total repaid so far and report loans repaid below {repaid_ratio} of principal."
    shape: list
    column: loan
    ref: >-
      MATCH (a:Account {_workspace_id:$workspace_id})-[r:REPAY]->(l:Loan {_workspace_id:$workspace_id})
      WITH l, sum(r.amount) AS repaid WHERE repaid < l.principal * $repaid_ratio
      RETURN l.id AS loan, l.principal AS principal, repaid ORDER BY repaid LIMIT $limit
    params: {repaid_ratio: 0.5}
